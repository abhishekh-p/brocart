<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ product.title }}</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f4f6f9;
            padding:40px;
        }

        .back-btn{
            display:inline-block;
            margin-bottom:30px;
            text-decoration:none;
            color:#2563eb;
            font-size:16px;
            font-weight:bold;
        }

        .back-btn:hover{
            text-decoration:underline;
        }

        .product-container{
            max-width:1000px;
            margin:auto;
            background:white;
            border-radius:15px;
            overflow:hidden;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);

            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;

            padding:30px;
        }

        .product-image img{
            width:100%;
            height:450px;
            object-fit:cover;
            border-radius:12px;
        }

        .product-details{
            display:flex;
            flex-direction:column;
            justify-content:center;
        }

        .product-title{
            font-size:40px;
            color:#111827;
            margin-bottom:20px;
        }

        .price{
            font-size:28px;
            color:#16a34a;
            font-weight:bold;
            margin-bottom:20px;
        }

        .description{
            font-size:17px;
            color:#555;
            line-height:1.7;
            margin-bottom:30px;
        }

        .cart-btn{
            display:inline-block;
            width:200px;
            text-align:center;
            text-decoration:none;
            background:#111827;
            color:white;
            padding:14px 20px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .cart-btn:hover{
            background:#2563eb;
            transform:translateY(-3px);
        }

        @media(max-width:768px){

            .product-container{
                grid-template-columns:1fr;
            }

            .product-title{
                font-size:30px;
            }

            .product-image img{
                height:350px;
            }

        }

    </style>

</head>

<body>

    <a href="{% url 'home' %}" class="back-btn">
        ← Back to Products
    </a>

    <div class="product-container">

        <div class="product-image">

            <img src="{{ product.img.url }}" alt="{{ product.title }}">

        </div>

        <div class="product-details">

            <h1 class="product-title">
                {{ product.title }}
            </h1>

            <div class="price">
                ₹ {{ product.prize }}
            </div>

            <p class="description">
                {{ product.discription }}
            </p>

            <a href="{% url 'add_to_cart' product.id %}" class="cart-btn">
                Add to Cart
            </a>

        </div>

    </div>

</body>
</html>
