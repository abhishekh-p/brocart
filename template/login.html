<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Login Page</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(135deg,#141e30,#243b55);
        }

        .login-box{
            background:rgba(255,255,255,0.1);
            backdrop-filter:blur(10px);
            padding:40px;
            width:370px;
            border-radius:16px;
            box-shadow:0px 8px 25px rgba(0,0,0,0.4);
            color:white;
        }

        .login-box h2{
            text-align:center;
            margin-bottom:30px;
            font-size:32px;
            letter-spacing:1px;
        }

        .input-group{
            margin-bottom:22px;
        }

        .input-group label{
            display:block;
            margin-bottom:8px;
            font-size:14px;
            font-weight:bold;
        }

        .input-group input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            font-size:15px;
            background:rgba(255,255,255,0.2);
            color:white;
        }

        .input-group input::placeholder{
            color:#ddd;
        }

        .input-group input:focus{
            outline:none;
            border:2px solid #00c6ff;
            background:rgba(255,255,255,0.25);
        }

        .login-btn{
            width:100%;
            padding:14px;
            background:#00c6ff;
            color:white;
            border:none;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            cursor:pointer;
            transition:0.3s;
        }

        .login-btn:hover{
            background:#0072ff;
            transform:translateY(-2px);
        }

        .error{
            color:#ffb3b3;
            margin-bottom:15px;
            text-align:center;
            font-size:14px;
        }

        .extra-links{
            margin-top:20px;
            text-align:center;
            font-size:14px;
        }

        .extra-links a{
            color:#00c6ff;
            text-decoration:none;
            font-weight:bold;
        }

        .extra-links a:hover{
            text-decoration:underline;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>Welcome Back</h2>

        <form action="{% url 'login' %}" method="POST">

            {% csrf_token %}

            {% if error_message %}
                <p class="error">{{ error_message }}</p>
                
            {% endif %}

            {% if success_message %}
                <p class ="success">{{success_message}}</p>
            
            {% endif %}
            <div class="input-group">

                <label>Username</label>

                <input type="text"
                       name="username"
                       placeholder="Enter your username"
                       required>

            </div>

            <div class="input-group">

                <label>Password</label>

                <input type="password"
                       name="password"
                       placeholder="Enter your password"
                       required>

            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

            <div class="extra-links">
                <p>
                    Don't have an account?
                    <a href="{% url 'register' %}">Register</a>
                </p>
            </div>

        </form>

    </div>

</body>
</html>
