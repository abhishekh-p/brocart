<!DOCTYPE html>
<html>
<head>
    <title>Pay Now</title>

    <style>

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#f4f4f4;
            font-family:Arial;
        }

        .payment-box{
            background:white;
            padding:40px;
            border-radius:12px;
            box-shadow:0 5px 20px rgba(0,0,0,0.1);
            text-align:center;
        }

        button{
            background:#3399cc;
            color:white;
            border:none;
            padding:15px 30px;
            font-size:18px;
            border-radius:8px;
            cursor:pointer;
        }

    </style>

</head>

<body>

    <div class="payment-box">

        <h2>
            Complete Your Payment
        </h2>

        <h1>
            ₹ {{ total }}
        </h1>

        <button id="rzp-button1">
            Pay Now
        </button>

    </div>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <script>

        var options = {

            "key": "{{ razorpay_key }}",

            "amount": "{{ amount }}",

            "currency": "INR",

            "name": "BroCart",

            "description": "Order Payment",

            "order_id": "{{ razorpay_order_id }}",

            "handler": function (response){

                window.location.href = "/success/";

            },

            "theme": {
                "color": "#3399cc"
            }
        };

        var rzp1 = new Razorpay(options);

        document.getElementById('rzp-button1').onclick = function(e){

            rzp1.open();

            e.preventDefault();
        }

    </script>

</body>
</html>
