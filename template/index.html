{% extends 'base.html' %}
{% block content %}

<style>

body{
    background:#f5f5f5;
    font-family:Arial, sans-serif;
}

h1{
    text-align:center;
    margin:30px 0;
    color:#333;
}

.container{
    width:90%;
    max-width:1200px;
    margin:auto;

    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:25px;
}

.card{
    background:white;
    border-radius:10px;
    overflow:hidden;
    box-shadow:0 5px 15px rgba(0,0,0,.15);
    transition:.3s;
    text-align:center;
    padding-bottom:20px;
}

.card:hover{
    transform:translateY(-8px);
}

.card img{
    width:100%;
    height:250px;
    object-fit:cover;
}

.no-image{
    height:250px;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#eee;
    color:#666;
}

.card h3{
    margin:15px 0 10px;
    color:#333;
}

.price{
    font-size:22px;
    color:#28a745;
    font-weight:bold;
    margin-bottom:15px;
}

.btn{
    display:inline-block;
    text-decoration:none;
    background:#007bff;
    color:white;
    padding:10px 20px;
    border-radius:5px;
    transition:.3s;
}

.btn:hover{
    background:#0056b3;
}

</style>

<h1>WELCOME TO MY SHOP</h1>

<div class="container">

{% for product in products %}

<div class="card">

    {% if product.img %}
        <img src="{{ product.img.url }}" alt="{{ product.title }}">
    {% else %}
        <div class="no-image">
            No Image Available
        </div>
    {% endif %}

    <h3>{{ product.title }}</h3>

    <p class="price">₹ {{ product.prize }}</p>

    <a href="{% url 'product_details' product.id %}" class="btn">
        View Details
    </a>

</div>

{% endfor %}

</div>

{% endblock %}
