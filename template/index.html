{% extends 'base.html' %}
{% block content %}

<h1>WELCOME TO MY SHOP</h1>

<div class="container">

    {% for product in products %}

    <div class="card">

        {% if product.img %}

            <img src="{{ product.img.url }}"
                alt="{{ product.title }}"
                width="200">
        {% else %}
            <p>no image availble</p>
        {% endif %}
        <h3>{{ product.title }}</h3>

        <p>₹ {{ product.prize }}</p>

    </div>

    {% endfor %}

</div>

{% endblock %}
