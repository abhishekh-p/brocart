<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Placed</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:linear-gradient(to right,#141e30,#243b55);
        }

        .success-box{
            background:white;
            width:420px;
            padding:50px 40px;
            border-radius:18px;
            text-align:center;
            box-shadow:0 8px 25px rgba(0,0,0,0.3);
            animation:pop 0.5s ease;
        }

        @keyframes pop{
            0%{
                transform:scale(0.8);
                opacity:0;
            }

            100%{
                transform:scale(1);
                opacity:1;
            }
        }

        .check-icon{
            width:90px;
            height:90px;
            background:#16a34a;
            color:white;
            border-radius:50%;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:45px;
            margin:auto;
            margin-bottom:25px;
        }

        .success-title{
            font-size:34px;
            color:#111827;
            margin-bottom:15px;
        }

        .success-text{
            font-size:17px;
            color:#555;
            margin-bottom:30px;
            line-height:1.6;
        }

        .home-btn{
            display:inline-block;
            text-decoration:none;
            background:#111827;
            color:white;
            padding:14px 25px;
            border-radius:8px;
            font-size:16px;
            font-weight:bold;
            transition:0.3s;
        }

        .home-btn:hover{
            background:#2563eb;
            transform:translateY(-3px);
        }

    </style>

</head>

<body>

    <div class="success-box">

        <div class="check-icon">
            ✓
        </div>

        <h3 class="success-title">
            Order Placed!
        </h3>

        <p class="success-text">
            Your order has been placed successfully.
            Thank you for shopping with us.
        </p>

        <a href="{% url 'home' %}" class="home-btn">
            Continue Shopping
        </a>

    </div>

</body>
</html>
